# Configurare Logging pentru LAN Chat Application

# Handler-e disponibile
handlers= java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Nivel global de logging
.level= INFO

# Console Handler
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# File Handler
java.util.logging.FileHandler.pattern = logs/chat-app-%u-%g.log
java.util.logging.FileHandler.limit = 10000000
java.util.logging.FileHandler.count = 5
java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter

# Format pentru mesajele de log
java.util.logging.SimpleFormatter.format=%1$tF %1$tT [%4$s] %5$s %n

# Niveluri specifice pentru clase
org.chatapp.registry.RoomRegistryServer.level = INFO
org.chatapp.registry.RoomRegistryClient.level = INFO
org.chatapp.server.ChatServer.level = INFO
org.chatapp.server.ChatClient.level = INFO
org.chatapp.ChatApplication.level = INFO